exclude: >
  (?x)(
    \.egg-info
  )$
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.0
  hooks:
  - id: ruff
    name: Reorder Python imports
    # Scoped to import-sorting (I) only, matching the isort hook this
    # replaced. The full [tool.ruff.lint] extend-select in pyproject.toml
    # is the target config for TODO.md section 2, not yet enforced here —
    # 207 pre-existing findings in __init__.py/tests/docs need fixing first.
    args: ["--select=I", "--fix"]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.4.0
  hooks:
  - id: check-merge-conflict
  - id: check-symlinks
  - id: end-of-file-fixer
  - id: fix-encoding-pragma
  - id: mixed-line-ending
  - id: trailing-whitespace
- repo: https://gitlab.com/pycqa/flake8
  rev: 3.9.1
  hooks:
  - id: flake8
    exclude: _datetime\.py|docs
    args: ["--ignore=E501,D105"]
    additional_dependencies: ['pep8-naming', 'flake8-docstrings', 'pydocstyle<4.0', 'darglint']
- repo: https://github.com/ambv/black
  rev: 20.8b1
  hooks:
  - id: black
    language_version: python3.9
